name: Desktop CI

# Build & test modul :desktop (Compose Multiplatform) dan, di Windows,
# hasilkan installer .msi + .exe. Rilis desktop ditandai tag `desktop-v*`
# (terpisah dari tag Android `v*`).
on:
  push:
    branches: [main, muse/desktop-windows]
    paths: ['desktop/**', 'core/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', 'core/**', '.github/workflows/desktop.yml']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Desktop unit tests
        run: ./gradlew --no-daemon :desktop:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: desktop/build/reports/tests/

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI, EXE, distributable
        run: ./gradlew --no-daemon :desktop:packageMsi :desktop:packageExe :desktop:createDistributable

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: nadatube-msi
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: nadatube-exe
          path: desktop/build/compose/binaries/main/exe/*.exe

      - name: Upload portable distributable
        uses: actions/upload-artifact@v4
        with:
          name: nadatube-distributable
          path: desktop/build/compose/binaries/main/app/

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download MSI + EXE
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nadatube-{msi,exe}
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --title "NadaTube Desktop ${{ github.ref_name }}" --notes "NadaTube Desktop — pemutar audio YouTube tanpa iklan (AAC). Installer Windows (.msi/.exe). APK Android tetap di rilis v* terpisah."
          fi
          gh release upload "${{ github.ref_name }}" artifacts/*.msi artifacts/*.exe --clobber
